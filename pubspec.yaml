name: read_track
description: "ReadTrack — tracker de bibliothèque personnelle (livres à lire / lus / favoris)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.2.0

  # Persistance locale (Ma liste)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Images (cache + lazy loading)
  cached_network_image: ^3.4.1

  # i18n
  intl: ^0.20.3

  # Utilitaires
  path_provider: ^2.1.4
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true # active gen-l10n via l10n.yaml

  assets:
    - assets/data/books.json
    - assets/images/
