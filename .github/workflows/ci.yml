name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version fixée (plutôt que "channel: stable") pour que le
          # formatage et l'analyse statique restent identiques entre
          # deux exécutions, indépendamment des nouvelles versions
          # publiées entre-temps.
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit & widget tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  # Les tests d'intégration (integration_test/) nécessitent un vrai device
  # (desktop, émulateur ou navigateur piloté) : contrairement aux tests
  # unitaires/widgets, ils ne tournent pas en mode headless "flutter
  # tester". Le runner ubuntu-latest standard n'a ni écran ni émulateur
  # configuré par défaut. Ces tests sont donc exécutés et vérifiés en
  # local avant chaque merge (voir TEST_COVERAGE.md) plutôt qu'automatisés
  # ici, pour éviter un job CI durablement rouge ou instable.
